name: Chain activity

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/chain-activity.yml

permissions:
  contents: write

concurrency:
  group: chain-activity
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bakes the tower glow and outlines the big total so every browser draws them sharp and cheap
      # (optional: the script falls back to a live blur and live text without them).
      - name: Install image tools
        run: pip install pillow numpy fonttools uharfbuzz
        continue-on-error: true

      - name: Render assets/chain-activity.svg
        run: python3 scripts/chain_activity.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/chain-activity.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: sync chain activity"
            git pull --rebase origin main
            git push
          fi
